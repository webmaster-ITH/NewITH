<div class="row">
    <div class="col-sm-12">
        <!-- Filtros -->
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="searchInput" class="form-label">Buscar por nombre:</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar nota..."
                    [(ngModel)]="searchTerm" />
            </div>
            <div class="col-md-4">
                <label for="dateInput" class="form-label">Buscar por fecha:</label>
                <input type="date" id="dateInput" class="form-control" [(ngModel)]="searchDate" />
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary me-2" (click)="buscar()">Buscar</button>
                <button class="btn btn-secondary" (click)="limpiar()">Limpiar</button>
            </div>
        </div>

        <!-- Lista de notas -->
        <div class="row" *ngFor="let item of notas">
            <div class="col-md-3">
                <div class="row">
                    <img [src]="item.fotoperfil" loading="lazy" class="img-responsive noticia">
                    <h6 style="float:left">
                        <span class="badge badge-secondary" style="margin-left:10px">
                            {{item.fecha | date:'MMMM d'}}
                        </span>
                    </h6>
                    <img src="../imagenes/100 libre plastico logo 2.png" loading="lazy"
                        class="img-responsive-logo-libre-plastico"
                        style="float:right;margin-right:50px;margin-top:5px;max-width:80px">
                </div>
            </div>
            <div class="col-md-7">
                <div class="row">
                    <div class="col-md-12 text-uppercase titulo">
                        {{item.titulo}}
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12 contenido">
                        <div class="row">
                            <div class="col-md-12">
                                <input class="btn btn-sm" id="nota6" (click)="verNota(item.id)" type="button"
                                    value="Leer más..." />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mensaje si no hay resultados -->
        <div class="row" *ngIf="notas.length === 0">
            <div class="col-12 text-center py-4">
                <p>No se encontraron notas.</p>
            </div>
        </div>

        <!-- Paginación -->
        <div class="row mt-4" *ngIf="totalPages > 0">
            <div class="col-12 d-flex justify-content-center">
                <nav aria-label="Paginación de notas">
                    <ul class="pagination">
                        <li class="page-item" [class.disabled]="currentPage === 1">
                            <a class="page-link" href="javascript:void(0)" (click)="cambiarPagina(currentPage - 1)">
                                Anterior
                            </a>
                        </li>
                        <li class="page-item" *ngFor="let page of getPageNumbers()"
                            [class.active]="page === currentPage">
                            <a class="page-link" href="javascript:void(0)" (click)="cambiarPagina(page)">
                                {{page}}
                            </a>
                        </li>
                        <li class="page-item" [class.disabled]="currentPage === totalPages">
                            <a class="page-link" href="javascript:void(0)" (click)="cambiarPagina(currentPage + 1)">
                                Siguiente
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- Info de paginación -->
        <div class="row" *ngIf="totalNotas > 0">
            <div class="col-12 text-center">
                <small class="text-muted">
                    Mostrando {{((currentPage - 1) * pageSize) + 1}} - {{Math.min(currentPage * pageSize, totalNotas)}}
                    de {{totalNotas}} notas
                </small>
            </div>
        </div>
    </div>
</div>
