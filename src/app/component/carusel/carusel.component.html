<div class="row">
  <div class="col-md-12">
    <div class="carousel-container">
      <div class="carousel-slides" [style.transform]="getTransform()">
        <div 
          *ngFor="let slide of slides"
          class="carousel-slide" 
          [class.clickable]="hasAction(slide)"
          (click)="onSlideClick(slide, $event)"
          [style.cursor]="hasAction(slide) ? 'pointer' : 'default'">
          
          <!-- Slide sin link o con link '#' (solo imagen) -->
          <ng-container *ngIf="(!slide.link || slide.link === '#') && !slide.downloadUrl">
            <img [src]="slide.image" [alt]="slide.alt">
            <!-- <div class="slide-caption" *ngIf="slide.title || slide.description">
              <h3>{{ slide.title }}</h3>
              <p>{{ slide.description }}</p>
            </div> -->
          </ng-container>

          <!-- Slide con descarga -->
          <ng-container *ngIf="slide.downloadUrl">
            <img [src]="slide.image" [alt]="slide.alt">
            <!-- <div class="slide-caption">
              <h3>{{ slide.title }}</h3>
              <p>{{ slide.description }}</p>
              <span class="action-icon">
                📥 Descargar
              </span>
            </div> -->
          </ng-container>

          <!-- Slide con routerLink (rutas internas de Angular) -->
          <a 
            *ngIf="!slide.downloadUrl && slide.link && slide.link !== '#' && isInternalRoute(slide.link)"
            [routerLink]="slide.link"
            class="slide-link">
            <img [src]="slide.image" [alt]="slide.alt">
            <!-- <div class="slide-caption">
              <h3>{{ slide.title }}</h3>
              <p>{{ slide.description }}</p>
              <span class="action-icon">
                🔗 Ver más
              </span>
            </div> -->
          </a>

          <!-- Slide con href (URLs externas o archivos .html) -->
          <a 
            *ngIf="!slide.downloadUrl && slide.link && slide.link !== '#' && !isInternalRoute(slide.link)"
            [href]="slide.link"
            [target]="slide.openInNewTab ? '_blank' : '_self'"
            [rel]="slide.openInNewTab ? 'noopener noreferrer' : null"
            class="slide-link">
            <img [src]="slide.image" [alt]="slide.alt">
            <!-- <div class="slide-caption">
              <h3>{{ slide.title }}</h3>
              <p>{{ slide.description }}</p>
              <span class="action-icon">
                🔗 Ver más
              </span>
            </div> -->
          </a>

        </div>
      </div>

      <button class="carousel-nav prev" (click)="moveSlide(-1); $event.stopPropagation()">❮</button>
      <button class="carousel-nav next" (click)="moveSlide(1); $event.stopPropagation()">❯</button>

      <div class="carousel-indicators">
        <div 
          *ngFor="let slide of slides; let i = index"
          class="indicator"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i); $event.stopPropagation()">
        </div>
      </div>
    </div>
  </div>
</div>
