        <style>
                .sitios-container {
                        max-width: 1400px;
                        margin: 0 auto;
                        padding: 2rem 1rem;
                        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                }

                .header-section {
                        text-align: center;
                        margin-bottom: 3rem;
                }

                .section-title {
                        font-size: 2.5rem;
                        font-weight: 700;
                        color: #1a1a2e;
                        margin-bottom: 0.5rem;
                        letter-spacing: -0.5px;
                }

                .title-underline {
                        width: 80px;
                        height: 4px;
                        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
                        margin: 0 auto;
                        border-radius: 2px;
                }

                .sites-grid {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                        gap: 2rem;
                        margin-bottom: 2rem;
                }

                .site-card {
                        position: relative;
                        background: #ffffff;
                        border-radius: 20px;
                        overflow: hidden;
                        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                        height: 100%;
                }

                .site-card:hover {
                        transform: translateY(-8px);
                        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
                }

                .site-card::before {
                        content: '';
                        position: absolute;
                        top: 0;
                        left: 0;
                        right: 0;
                        height: 4px;
                        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
                        opacity: 0;
                        transition: opacity 0.3s ease;
                }

                .site-card:hover::before {
                        opacity: 1;
                }

                .site-link {
                        display: block;
                        text-decoration: none;
                        color: inherit;
                        height: 100%;
                }

                .image-wrapper {
                        position: relative;
                        width: 100%;
                        min-height: 250px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        overflow: hidden;
                        background: #f8f9fa;
                }

                .site-image {
                        width: 100%;
                        height: auto;
                        max-height: 300px;
                        object-fit: contain;
                        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                }

                .site-card:hover .site-image {
                        transform: scale(1.08);
                }

                .image-overlay {
                        position: absolute;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.2) 100%);
                        opacity: 0;
                        transition: opacity 0.3s ease;
                }

                .site-card:hover .image-overlay {
                        opacity: 1;
                }

                .card-content {
                        padding: 1.25rem;
                        background: #ffffff;
                }

                .card-title {
                        font-size: 1rem;
                        font-weight: 600;
                        color: #2d3748;
                        margin: 0;
                        line-height: 1.4;
                        text-align: center;
                }

                /* Responsive adjustments */
                @media (max-width: 768px) {
                        .sitios-container {
                                padding: 1.5rem 0.75rem;
                        }

                        .section-title {
                                font-size: 2rem;
                        }

                        .sites-grid {
                                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                                gap: 1.5rem;
                        }
                }

                @media (max-width: 480px) {
                        .section-title {
                                font-size: 1.75rem;
                        }

                        .sites-grid {
                                grid-template-columns: 1fr;
                                gap: 1.25rem;
                                padding: 0 0.5rem;
                        }

                        .site-card {
                                max-width: 400px;
                                margin: 0 auto;
                        }
                }

                /* Animation on scroll */
                @keyframes fadeInUp {
                        from {
                                opacity: 0;
                                transform: translateY(30px);
                        }

                        to {
                                opacity: 1;
                                transform: translateY(0);
                        }
                }

                .site-card {
                        animation: fadeInUp 0.6s ease-out backwards;
                }

                .site-card:nth-child(1) {
                        animation-delay: 0.1s;
                }

                .site-card:nth-child(2) {
                        animation-delay: 0.2s;
                }

                .site-card:nth-child(3) {
                        animation-delay: 0.3s;
                }

                .site-card:nth-child(4) {
                        animation-delay: 0.4s;
                }

                .site-card:nth-child(5) {
                        animation-delay: 0.5s;
                }

                .site-card:nth-child(6) {
                        animation-delay: 0.6s;
                }

                .site-card:nth-child(7) {
                        animation-delay: 0.7s;
                }

                .site-card:nth-child(8) {
                        animation-delay: 0.8s;
                }

                .site-card:nth-child(9) {
                        animation-delay: 0.9s;
                }

                .site-card:nth-child(10) {
                        animation-delay: 1s;
                }

                .site-card:nth-child(11) {
                        animation-delay: 1.1s;
                }

                .site-card:nth-child(12) {
                        animation-delay: 1.2s;
                }
        </style>
