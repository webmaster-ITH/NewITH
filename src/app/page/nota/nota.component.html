<div class="row">
    <div class="col-md-12">
        <div class="col-md-12">
            <h3 class="text-uppercase tnota">{{ nota.titulo }}</h3>
        </div>
        <div class="col-md-12">
            <div>
                <img [src]="nota.fotoperfil" class="img-responsive" style="max-width:100%; height:60%" loading="lazy"
                    alt="Foto de perfil">
            </div>
        </div>
        <div class="col-md-12">
            <p style="text-align:justify">
                <br><br><br>
                <label id="fecha-noticia" style="float:right">{{ nota.fecha | date:'longDate' }}</label>
                <br>{{ nota.contenido }}
                <br>¡Te invitamos a conocerlos y compartirlos!
                <br><br>
                "En el Esfuerzo Común, La Grandeza de Todos".<br>
                #TodosSomosTecNM<br>
                #TecNMCercaDeTi<br>
                #CelebrandoNuestraHistoria<br><br>
            </p>
        </div>
        <div class="col-md-12">
            <h4>Galería de Imágenes</h4>
            <div class="row">
                <div class="col-md-3" *ngFor="let imagen of nota.imagen; let i = index">
                    <div class="thumbnail" style="cursor: pointer;" (click)="imagenSeleccionada = imagen">
                        <img [src]="imagen.url" loading="lazy" class="img-responsive" [alt]="imagen.descripcion"
                            style="width: 100%; height: 200px; object-fit: cover;">
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal / Lightbox -->
        <div *ngIf="imagenSeleccionada" class="imagen-overlay" (click)="imagenSeleccionada = null"
            style="position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.85); z-index:1050; cursor: zoom-out;">

            <div (click)="$event.stopPropagation()" style="position: relative; max-width:90%; max-height:90%;">

                <img [src]="imagenSeleccionada.url" [alt]="imagenSeleccionada.descripcion"
                    style="display:block; max-width:100%; max-height:80vh; margin:0 auto; border-radius:4px;">

                <div *ngIf="imagenSeleccionada.descripcion"
                    style="text-align:center; color:#fff; margin-top:12px; font-size:16px;">
                    {{ imagenSeleccionada.descripcion }}
                </div>

                <button (click)="imagenSeleccionada = null"
                    style="position:absolute; top:-40px; right:0; background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:32px; cursor:pointer; width:40px; height:40px; border-radius:50%; line-height:1; transition: background 0.2s;"
                    onmouseover="this.style.background='rgba(255,255,255,0.3)'"
                    onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    &times;
                </button>
            </div>
        </div>
    </div>
</div>
